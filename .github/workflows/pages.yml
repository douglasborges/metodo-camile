name: Publicar Método Camile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validar Método Camile · CGU pós-edital v1.6
        run: |
          cp src/app.js /tmp/app.mjs
          cp src/core.js /tmp/core.mjs
          cp src/personal.js /tmp/personal.mjs
          cp src/progress.js /tmp/progress.mjs
          cp src/analytics.js /tmp/analytics.mjs
          cp src/achievements.js /tmp/achievements.mjs
          cp src/cgu-syllabus.js /tmp/cgu-syllabus.mjs
          cp src/cgu-materials.js /tmp/cgu-materials.mjs
          node --check /tmp/app.mjs
          node --check /tmp/core.mjs
          node --check /tmp/personal.mjs
          node --check /tmp/progress.mjs
          node --check /tmp/analytics.mjs
          node --check /tmp/achievements.mjs
          node --check /tmp/cgu-syllabus.mjs
          node --check /tmp/cgu-materials.mjs
          node --check drive-sync.js
          node --check drive-sync-ui.js

          grep -q "PÓS-EDITAL · CGU 2026" index.html
          grep -q "Camile, Auditora Federal da Controladoria-Geral da União" index.html
          grep -q "1.6.0-cgu-final-materials" index.html
          grep -q "version.json" index.html

          grep -q "CGU_OFFICIAL_TOTAL=266" src/cgu-syllabus.js
          grep -q "CGU_OPERATIONAL_TOTAL" src/cgu-syllabus.js
          grep -q "weeklyMinimum=1800" src/core.js
          grep -q "dailyMinimum=300" src/core.js
          grep -Fq "['afo','auditoria','adm-publica','dcon','dad']" src/core.js
          grep -q "afo-andre-receita" src/core.js
          grep -q "afo-pacelli-2026" src/core.js
          grep -q "afo-estatais-1303" src/core.js
          grep -q "CPU A2.4 · DEFERIDA" src/core.js
          grep -q "Estratégia pós-edital · Execução Contratual" src/core.js
          grep -q "Estratégia pós-edital · Transferências/Parcerias" src/core.js
          grep -q "Estratégia pós-edital · Integridade da Informação" src/core.js
          grep -q "Arranjos Institucionais" src/core.js
          grep -q "historical-camile" src/core.js
          grep -q "blocksCompleted" src/core.js

          grep -q "GOAL_PLAN_VERSION=3" src/personal.js
          grep -q "GOAL_CYCLES_PER_META=4" src/personal.js
          grep -q "GOAL_META_COUNT=8" src/personal.js
          grep -q "WEEKLY_MAINTENANCE" src/personal.js
          grep -q "CPU A2.4–A2.6" src/personal.js
          grep -q "André 17–19" src/personal.js

          grep -q "DEFERRED_MATERIALS" src/cgu-materials.js
          grep -q "Camile não estudará CPU agora" src/cgu-materials.js
          grep -q "Giovanni Pacelli" src/cgu-materials.js
          grep -q "André Luís" src/cgu-materials.js
          grep -q "Compliance e Integridade no Setor Público e Privado" src/cgu-materials.js
          grep -q "Como Combater a Corrupção em Licitações" src/cgu-materials.js
          grep -q "BOOK_ROUTES" src/cgu-materials.js
          grep -q "GAP_REGISTER" src/cgu-materials.js
          grep -q "A3.7" src/cgu-materials.js
          grep -q "A5.6" src/cgu-materials.js
          grep -q "Fase 4" src/cgu-materials.js
          grep -q "active:false" src/cgu-materials.js

          grep -q "VERSÃO EM USO" src/app.js
          grep -q "APP_VERSION_LABEL='v1.6'" src/app.js
          grep -q "CPU / MATERIAL DEFERIDO" src/app.js
          grep -q "LACUNAS CONTROLADAS · V1.6" src/app.js
          grep -q "códigos internos da nossa matriz" src/app.js
          grep -q "Registrar leitura" src/app.js

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
