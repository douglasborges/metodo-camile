name: Publicar Método Camile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validar Método Camile · v1.6.1
        run: |
          cp src/app.js /tmp/app.mjs
          cp src/core.js /tmp/core.mjs
          cp src/personal.js /tmp/personal.mjs
          cp src/progress.js /tmp/progress.mjs
          cp src/analytics.js /tmp/analytics.mjs
          cp src/achievements.js /tmp/achievements.mjs
          cp src/cgu-syllabus.js /tmp/cgu-syllabus.mjs
          cp src/cgu-materials.js /tmp/cgu-materials.mjs
          node --check /tmp/app.mjs
          node --check /tmp/core.mjs
          node --check /tmp/personal.mjs
          node --check /tmp/progress.mjs
          node --check /tmp/analytics.mjs
          node --check /tmp/achievements.mjs
          node --check /tmp/cgu-syllabus.mjs
          node --check /tmp/cgu-materials.mjs
          node --check drive-sync.js
          node --check drive-sync-ui.js

          grep -q "PÓS-EDITAL · CGU 2026" index.html
          grep -q "1.6.1-cgu-bizurafo-cpu-final" index.html
          grep -q "weeklyMinimum=1800" src/core.js
          grep -q "dailyMinimum=300" src/core.js
          grep -Fq "['afo','auditoria','adm-publica','dcon','dad']" src/core.js

          grep -q "AFO / Finanças Públicas — somente Leandro Ravyelle · BizurAFO" src/core.js
          grep -q "cpu-pacelli-06" src/core.js
          grep -q "cpu-pacelli-07" src/core.js
          grep -q "cpu-pacelli-08" src/core.js
          grep -q "cpu-pacelli-13" src/core.js
          grep -q "cpu-pacelli-14" src/core.js
          grep -q "cpu-pacelli-15" src/core.js
          grep -q "studyPhase:4,priority:'FINAL',active:false" src/core.js
          ! grep -q "André Luís" src/core.js

          grep -q "GOAL_PLAN_VERSION=3" src/personal.js
          grep -q "GOAL_CYCLES_PER_META=4" src/personal.js
          grep -q "GOAL_META_COUNT=8" src/personal.js
          grep -q "AFO: somente BizurAFO" src/personal.js
          grep -q "CPU: Giovanni Pacelli, módulos 06–08 primeiro" src/personal.js
          grep -q "CPU Pacelli módulos 13–15" src/personal.js
          ! grep -q "André Luís" src/personal.js

          grep -q "Fase 4 · CPU + Sociedade Brasileira / Diversidade" src/cgu-materials.js
          grep -q "Giovanni Pacelli · Contabilidade Pública · videoaulas dos módulos 6, 7, 8, 13, 14 e 15" src/cgu-materials.js
          grep -q "somente BizurAFO" src/cgu-materials.js
          ! grep -q "André Luís" src/cgu-materials.js

          grep -q "APP_VERSION_LABEL='v1.6.1'" src/app.js
          grep -q "CPU / FASE FINAL" src/app.js
          grep -q "'cpu'" src/app.js
          grep -q "VERSÃO EM USO" src/app.js
          grep -q "Correção AFO/CPU · 16/10" src/app.js
          grep -q "version.json" index.html

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
