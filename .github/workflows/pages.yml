name: Publicar Método Camile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validar Método Camile · v2.0 Plano Final CGU
        run: |
          cp src/app.js /tmp/app.mjs
          cp src/core.js /tmp/core.mjs
          cp src/personal.js /tmp/personal.mjs
          cp src/progress.js /tmp/progress.mjs
          cp src/analytics.js /tmp/analytics.mjs
          cp src/achievements.js /tmp/achievements.mjs
          cp src/cgu-syllabus.js /tmp/cgu-syllabus.mjs
          cp src/cgu-materials.js /tmp/cgu-materials.mjs
          cp src/cgu-final-plan.js /tmp/cgu-final-plan.mjs
          cp src/cgu-final-runtime.js /tmp/cgu-final-runtime.mjs
          node --check /tmp/app.mjs
          node --check /tmp/core.mjs
          node --check /tmp/personal.mjs
          node --check /tmp/progress.mjs
          node --check /tmp/analytics.mjs
          node --check /tmp/achievements.mjs
          node --check /tmp/cgu-syllabus.mjs
          node --check /tmp/cgu-materials.mjs
          node --check /tmp/cgu-final-plan.mjs
          node --check /tmp/cgu-final-runtime.mjs
          node --check drive-sync.js
          node --check drive-sync-ui.js

          grep -q "2.0.0-cgu-auditoria-final-20261021" index.html
          grep -q "APP_VERSION_LABEL='v2.0'" src/app.js
          grep -q "function prioritiesPage()" src/app.js
          grep -q "Prioridades CGU" index.html
          grep -q "CYCLE_PLAN_VERSION=8" src/core.js
          grep -q "weeklyMinimum=1980" src/core.js
          grep -q "weeklyTarget=2340" src/core.js
          grep -q "dailyMinimum=300" src/core.js
          grep -q "dailyTarget=360" src/core.js
          grep -q "sundayReviewMinutes=180" src/core.js
          grep -q "FINAL_CGU_CYCLE_SUBJECTS" src/core.js
          grep -q "Domingo é reservado à revisão e não avança o ciclo" src/core.js
          grep -q "CGU_AUD_2026_10_20_FINAL_PROPOSTA_v1" src/cgu-final-plan.js
          grep -q "NAO_ESTUDAR_DUPLICADO" src/cgu-final-plan.js
          grep -q "EM_PREPARACAO_NO_PRINT" src/cgu-final-plan.js
          grep -q "PAC_AFO" src/cgu-final-runtime.js
          grep -q "PAC_CPU" src/cgu-final-runtime.js
          grep -q "MARC_AUD" src/cgu-final-runtime.js
          grep -q "MARC_ADM" src/cgu-final-runtime.js
          grep -q "RAFA_DAD" src/cgu-final-runtime.js
          grep -q "NELMA" src/cgu-final-runtime.js

          # OAuth/Drive precisa permanecer no mesmo mecanismo e identidade.
          grep -q "metodo-et:camile:v1" drive-sync.js
          grep -q "Metodo ET - Camile - Dados.json" drive-sync.js
          grep -q "camile-cloud-v1" drive-sync.js
          grep -q "242070309786-1rn9vsc4fo0coaq3e3mptrlf1m9f0kt3.apps.googleusercontent.com" drive-sync.js
          grep -q "https://douglasborges.github.io" drive-sync.js

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

