name: Publicar Método Camile

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Validar Método Camile · v1.6.2 OAuth
        run: |
          cp src/app.js /tmp/app.mjs
          cp src/core.js /tmp/core.mjs
          cp src/personal.js /tmp/personal.mjs
          cp src/progress.js /tmp/progress.mjs
          cp src/analytics.js /tmp/analytics.mjs
          cp src/achievements.js /tmp/achievements.mjs
          cp src/cgu-syllabus.js /tmp/cgu-syllabus.mjs
          cp src/cgu-materials.js /tmp/cgu-materials.mjs
          node --check /tmp/app.mjs
          node --check /tmp/core.mjs
          node --check /tmp/personal.mjs
          node --check /tmp/progress.mjs
          node --check /tmp/analytics.mjs
          node --check /tmp/achievements.mjs
          node --check /tmp/cgu-syllabus.mjs
          node --check /tmp/cgu-materials.mjs
          node --check drive-sync.js
          node --check drive-sync-ui.js

          grep -q "1.6.2-cgu-oauth-origin" index.html
          grep -q "APP_VERSION_LABEL='v1.6.2'" src/app.js
          grep -q "OAuth/Drive corrigido · 19/10" src/app.js
          grep -q "https://douglasborges.github.io" drive-sync.js
          grep -q "EXPECTED_OAUTH_ORIGIN" drive-sync.js
          grep -q "__METODO_ET_OAUTH_DIAGNOSTICS__" drive-sync.js
          grep -q "Origem OAuth" drive-sync-ui.js
          ! grep -q "oauth-client-hotfix.js" index.html

          grep -q "weeklyMinimum=1800" src/core.js
          grep -q "dailyMinimum=300" src/core.js
          grep -Fq "['afo','auditoria','adm-publica','dcon','dad']" src/core.js
          grep -q "AFO / Finanças Públicas — somente Leandro Ravyelle · BizurAFO" src/core.js
          grep -q "cpu-pacelli-06" src/core.js
          grep -q "cpu-pacelli-15" src/core.js
          grep -q "GOAL_PLAN_VERSION=3" src/personal.js
          grep -q "GOAL_CYCLES_PER_META=4" src/personal.js
          grep -q "GOAL_META_COUNT=8" src/personal.js

      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
