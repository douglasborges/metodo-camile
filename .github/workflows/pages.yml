name: Publicar Método Camile · Somente IMA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testes unitários e regressão
        run: npm test
      - name: Build somente IMA
        run: npm run build
      - name: Validar publicação sem CGU e fornecedores excluídos
        run: |
          set -e
          grep -q "3.0.1-ima-port-topicos-livres-20261112" dist/index.html
          grep -q "ima-only-app.js" dist/index.html
          grep -q "Metas IMA" dist/index.html
          grep -q "Thallius" dist/src/ima-only-state.js
          grep -q "Marcello Giulian" dist/src/ima-only-state.js
          grep -q "Bem-vida, Camile" dist/index.html
          grep -q "metodo-et:camile:v1" dist/drive-sync.js
          grep -q "Metodo ET - Camile - Dados.json" dist/drive-sync.js
          grep -q "camile-cloud-v1" dist/drive-sync.js
          grep -q "242070309786-1rn9vsc4fo0coaq3e3mptrlf1m9f0kt3.apps.googleusercontent.com" dist/drive-sync.js
          test ! -f dist/src/app.js
          test ! -f dist/src/cgu-final-runtime.js
          test ! -f dist/src/portugues-andresan-catalog.js
          test ! -f dist/data/initial-state.json
          if grep -Eiq 'CGU|7 Fontes|Andresan' dist/index.html dist/manifest.webmanifest; then
            echo "Referência ao concurso antigo no shell publicado."
            exit 1
          fi
      - name: Empacotar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
