      "s": "C3",
      "a": "E",
      "q": "Em processo administrativo sancionador, o contraditório pode ser dispensado sempre que existirem indícios de irregularidade.",

    },
    {
      "id": "Q063",
      "s": "C3",
      "a": "C",
      "q": "Controle interno e controle externo têm papéis institucionais distintos e podem atuar de maneira complementar.",

    {
      "id": "Q064",
      "s": "C3",
      "a": "E",
      "q": "A CGU integra o Poder Judiciário e exerce, como atribuição exclusiva, o controle externo das contas federais.",

    },
    {
      "id": "Q065",
      "s": "C3",
      "a": "C",
      "q": "Uma irregularidade detectada em auditoria não define automaticamente a responsabilidade individual de determinado servidor.",

    {
      "id": "Q066",
      "s": "C3",

    },
    {
      "id": "Q067",
      "s": "C3",
      "a": "C",
      "q": "Processo administrativo disciplinar e processo administrativo de responsabilização de pessoa jurídica possuem objetos e regimes jurídicos distintos.",

    },
    {
      "id": "Q068",
      "s": "C3",
      "a": "E",
      "q": "Acordo de leniência e denúncia de ouvidoria são procedimentos equivalentes, ambos destinados apenas a acolher reclamações.",

    {
      "id": "Q069",
      "s": "C3",

    {
      "id": "Q070",
      "s": "C3",
      "a": "E",

    {
      "id": "Q071",
      "s": "C4",
      "a": "C",
      "q": "Correlação estatística entre duas variáveis não basta, isoladamente, para provar relação causal.",

    },
    {
      "id": "Q072",
      "s": "C4",
      "a": "E",
      "q": "Um modelo com alta acurácia global necessariamente apresenta desempenho equivalente em todos os grupos sociais.",

    },
    {
      "id": "Q073",
      "s": "C4",
      "a": "C",
      "q": "A taxa de denúncias depende, entre outros fatores, da capacidade de detecção e da confiança das pessoas nos canais de relato.",

    },
    {
      "id": "Q074",
      "s": "C4",
      "a": "E",
      "q": "Falso positivo ocorre quando o sistema deixa de identificar um caso que realmente pertence à classe de interesse.",

    },
    {
      "id": "Q075",
      "s": "C4",
      "a": "C",
      "q": "A rastreabilidade de dados contribui para verificar origem, transformações e limites das evidências utilizadas.",
      "e": "Linhagem e documentação permitem auditar o percurso da informação."
    },
    {
      "id": "Q076",
      "s": "C4",
      "a": "E",
      "q": "O uso de IA generativa dispensa a verificação das fontes quando o texto produzido apresenta linguagem confiante e detalhada.",

    },
    {
      "id": "Q077",
      "s": "C4",
      "a": "C",
      "q": "Uma amostra não representativa pode limitar a generalização de conclusões para toda a população de interesse.",

    },
    {
      "id": "Q078",
      "s": "C4",
      "a": "E",

    },
    {
      "id": "Q079",
      "s": "C4",

    },
    {
      "id": "Q080",
      "s": "C4",

      "q": "A falácia ecológica consiste em projetar corretamente para cada indivíduo uma relação observada em dados agregados.",

    },
    {
      "id": "Q081",

      "q": "A auditoria interna governamental pode prestar serviços de avaliação e consultoria sem assumir responsabilidades próprias da gestão.",

    },
    {
      "id": "Q082",
      "s": "C5",
      "a": "E",
      "q": "O auditor deve implantar pessoalmente todas as recomendações emitidas, pois a responsabilidade pelo controle passa à auditoria.",

    },
    {
      "id": "Q083",
      "s": "C5",
      "a": "C",
      "q": "Risco, materialidade e relevância social podem orientar a priorização dos trabalhos de auditoria.",

    },
    {
      "id": "Q084",
      "s": "C5",
      "a": "E",
      "q": "O mero surgimento de um sinal de risco constitui evidência suficiente e conclusiva de fraude praticada.",

    {
      "id": "Q085",
      "s": "C5",
      "a": "C",
      "q": "Evidência suficiente refere-se à quantidade, enquanto adequação se relaciona à qualidade e relevância da evidência.",

    },
    {
      "id": "Q086",
      "s": "C5",
      "a": "E",
      "q": "Plano de ação aprovado comprova automaticamente o benefício efetivamente alcançado pela política auditada.",

    {
      "id": "Q087",
      "s": "C5",
      "a": "C",

    },
    {
      "id": "Q088",
      "s": "C5",
      "a": "E",

    },
    {
      "id": "Q089",
      "s": "C5",
      "a": "C",

    {
      "id": "Q090",
      "s": "C5",
      "a": "E",

    {

    {

      "a": "E",

    },
    {
      "id": "Q093",
      "s": "A1",
      "a": "C",
      "q": "O achado de auditoria pode ser estruturado a partir de critério, condição, causa e efeito, conforme pertinente ao caso.",

    },
    {
      "id": "Q094",
      "s": "A1",
      "a": "E",
      "q": "Amostragem por julgamento autoriza extrapolação estatística da taxa de irregularidades para todo o universo.",

    },
    {
      "id": "Q095",
      "s": "A1",
      "a": "C",
      "q": "Confirmação externa pode fornecer evidência relevante, mas sua confiabilidade depende do contexto e da origem da informação.",

    },
    {
      "id": "Q096",
      "s": "A1",

    {
      "id": "Q097",

    },
    {
      "id": "Q098",
      "s": "A1",

    {
      "id": "Q099",
      "s": "A1",
      "a": "C",
      "q": "Uma recomendação orientada à causa de um problema tende a ser mais sustentável que a correção apenas de seu efeito imediato.",

    {
      "id": "Q100",
      "s": "A1",
      "a": "E",
      "q": "A implementação formal de uma recomendação prova, sem outra evidência, a efetividade do controle criado.",

    },
    {

      "s": "A2",
      "a": "C",
      "q": "O empenho é estágio da despesa orçamentária que antecede, em regra, liquidação e pagamento.",

      "id": "Q102",

    {
      "id": "Q104",
      "s": "A2",

    {
      "id": "Q105",

    },
    {
      "id": "Q106",
      "s": "A2",
      "a": "E",

    {
      "id": "Q107",

    },
    {
      "id": "Q108",
      "s": "A2",
      "a": "E",
      "q": "Uma provisão e um passivo contingente são contabilizados de forma idêntica em qualquer situação de incerteza.",

    },
    {
      "id": "Q109",
      "s": "A2",
      "a": "C",
      "q": "Bens públicos e externalidades justificam análise da função alocativa do Estado.",

    },
    {
      "id": "Q110",
      "s": "A2",
      "a": "E",
      "q": "A função distributiva da política fiscal se limita à estabilização da inflação, sem relação com desigualdade.",

    {
      "id": "Q111",
      "s": "A3",
      "a": "C",
      "q": "A teoria da mudança explicita relações esperadas entre recursos, atividades e efeitos de uma intervenção pública.",

    },
    {
      "id": "Q112",
      "s": "A3",
      "a": "E",

    {
      "id": "Q113",
      "s": "A3",

    {
      "id": "Q114",
      "s": "A3",

    {
      "id": "Q115",
      "s": "A3",
      "a": "C",

    },
    {
      "id": "Q116",
      "s": "A3",
      "a": "E",
      "q": "Resultados estatisticamente não significativos comprovam necessariamente que o efeito verdadeiro da política é exatamente zero.",

    },
    {
      "id": "Q117",
      "s": "A3",
      "a": "C",

    },
    {
      "id": "Q118",
      "s": "A3",
      "a": "E",
      "q": "Amostragem intencional em entrevistas permite inferência estatística automática para toda a população nacional.",

    {

      "s": "A3",

    },
    {
      "id": "Q120",
      "s": "A3",
      "a": "E",
      "q": "Validade externa trata exclusivamente da ausência de erro de digitação no banco de dados analisado.",

    {
      "id": "Q121",

      "q": "Uma pesquisa de preços com fontes inadequadas pode elevar risco de contratação antieconômica e exige análise crítica do planejamento.",

    {
      "id": "Q122",

      "a": "C",
      "q": "A fiscalização contratual deve considerar evidências de quantidade, qualidade e aceitação dos bens e serviços efetivamente entregues.",

    {
      "id": "Q124",
      "s": "A4",

      "q": "A existência de nota fiscal é prova absoluta de que todo o objeto contratado foi entregue com a qualidade esperada.",

    {

    {

      "s": "A4",

    {
      "id": "Q127",
      "s": "A4",

    {
      "id": "Q128",
      "s": "A4",
      "a": "E",
      "q": "O reequilíbrio econômico-financeiro do contrato pode ser concedido automaticamente por pedido verbal da empresa, sem fundamentação ou exame das condições.",

    {
      "id": "Q129",
      "s": "A4",
      "a": "C",

    {
      "id": "Q130",

      "a": "E",

    {

      "s": "A5",

    {

    {
      "id": "Q133",
      "s": "A5",
      "a": "C",

    {
      "id": "Q134",
      "s": "A5",
      "a": "E",

    },
    {
      "id": "Q135",
      "s": "A5",
      "a": "C",

    {
      "id": "Q136",
      "s": "A5",
      "a": "E",
      "q": "Um relato protegido de assédio deve ser divulgado integralmente para todo o órgão como requisito para a ampla defesa.",

    {
      "id": "Q137",

};</script><script>const {subjects:SUBJECTS,questions:BANK}=CONTENT;

function chooseQs(count,type='mixed',target='all'){
 let pool=specBank().filter(q=>target==='all'||q.s===target);
 if(type==='wrong'){pool=pool.filter(q=>(db.attempts[q.id]?.wrong||0)>0);}

 function select(candidates,num){const by={};for(const q of candidates){(by[q.s]??=[]).push(q)};for(const a of Object.values(by))a.sort((x,y)=>rank(y)-rank(x));const order=Object.keys(by).sort((a,b)=>hash(day+a+db.spec)-hash(day+b+db.spec));let picked=[];while(picked.length<num){let added=false;for(const sid of order){const q=by[sid].shift();if(q&&!taken.has(q.id)){taken.add(q.id);picked.push(q);added=true;if(picked.length===num)break}}if(!added)break}return picked}

function timerText(s){let sec=Math.floor((Date.now()-s.startedAt)/1000);return `${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`}
function exam(){if(!db.session){navigate('setup');return}const s=db.session;const q=BANK.find(q=>q.id===s.itemIds[s.current]);if(!q){alert('Sessão inválida.');db.session=null;save();navigate('setup');return}const done=s.itemIds.filter(id=>s.answers[id]==='C'||s.answers[id]==='E').length,blankCount=s.itemIds.filter(id=>s.answers[id]==='-').length;
 shell(`<div class="exam-top"><div><div class="eyebrow">Prova em andamento · gabarito oculto</div><h1 class="page-title" style="margin-bottom:0">Seu desafio Cebraspe</h1></div>${badge(s.type==='wrong'?'Revisão de erros':'Treino de '+s.itemIds.length+' itens')}</div><div class="exam-layout"><div><div style="display:flex;justify-content:space-between;color:var(--muted);font-size:12px"><span>Questão ${s.current+1} de ${s.itemIds.length}</span><span>${done} marcadas · ${blankCount} deixadas em branco</span></div><div class="progress"><span style="width:${pct(done+blankCount,s.itemIds.length)}%"></span></div><div class="question"><div class="question-meta">${badge(groupFor(q)==='Básicos'?'P1 · Básicos':groupFor(q)==='Complementares'?'P2 · Complementares':'P3 · Específicos')}${badge(GROUPS.includes(groupFor(q))?'Vale ±1 ponto':'Vale ±2 pontos','amber')}</div><div style="color:var(--muted);font-size:13px;font-weight:700">${nameFor(q.s)}</div><p class="question-text">${q.q}</p><div class="answers">${[['C','C','Certo'],['E','E','Errado'],['-','—','Em branco']].map(([v,symbol,title])=>`<button type="button" class="answer ${s.answers[q.id]===v?'checked':''}" data-answer="${v}"><span class="letter">${symbol}</span><small>${title}</small></button>`).join('')}</div><p class="small-note" style="margin:21px 0 0">Selecione C, E ou deixe em branco. Você pode mudar sua resposta até entregar a prova.</p></div><div class="exam-footer"><button class="btn btn-outline" data-action="prev" ${s.current===0?'disabled':''}>← Anterior</button><span class="small-note" id="timer-small">${timerText(s)}</span><button class="btn ${s.current===s.itemIds.length-1?'btn-primary':'btn-soft'}" data-action="${s.current===s.itemIds.length-1?'finish':'next'}">${s.current===s.itemIds.length-1?'Entregar prova ✓':'Próxima →'}</button></div></div><aside class="exam-aside"><div class="panel"><h3>Cartão-resposta</h3><p class="hint">Toque em um número para navegar.</p><div class="grid-nums">${s.itemIds.map((id,i)=>`<button class="num ${s.answers[id]==='C'||s.answers[id]==='E'?'answered':s.answers[id]==='-'?'blank':''} ${s.current===i?'current':''}" data-jump="${i}" aria-label="Ir para questão ${i+1}">${i+1}</button>`).join('')}</div><div style="margin-top:17px;display:grid;gap:8px"><div class="mini"><span>Marcadas</span><b>${done}</b></div><div class="mini"><span>Em branco declaradas</span><b>${blankCount}</b></div><div class="mini"><span>Não marcadas</span><b>${s.itemIds.length-done-blankCount}</b></div></div><button class="btn btn-primary" style="width:100%;margin-top:15px" data-action="finish">Entregar e corrigir</button><button class="btn btn-outline" style="width:100%;margin-top:8px" data-action="abandon">Descartar sessão</button></div></aside></div>`)}
function result(){const h=currentResults||completed()[0];if(!h){navigate('history');return}const s={itemIds:h.itemIds,answers:h.answers};const c=compute(s);const special=h.spec;let rows=c.rows.filter(r=>reviewFilter==='all'||reviewFilter==='wrong'&&r.a!=='-'&&!r.correct||reviewFilter==='blank'&&r.a==='-'||reviewFilter==='right'&&r.correct);
 const groups=[['Básicos','P1 · Básicos',40],['Complementares','P2 · Complementares',40],[special,'P3 · Específicos',180]].map(([g,t,max])=>{const rs=c.rows.filter(r=>groupFor(r.q)===g),score=rs.reduce((a,r)=>a+(r.a==='-'?0:r.correct?r.w:-r.w),0),m=rs.reduce((a,r)=>a+r.w,0);return `<div class="break-card"><small>${t}</small><strong>${score>=0?'+':''}${score}<span style="color:var(--muted);font-size:12px;font-weight:500"> / ${m}</span></strong><small>${rs.filter(r=>r.correct).length} corretas / ${rs.length} itens</small></div>`}).join('');
 shell(`<div class="eyebrow">Correção concluída · ${fmtDate(h.date)}</div><h1 class="page-title">Seu desempenho em detalhes</h1><p class="desc">Cada item errado descontou a pontuação correspondente. Confira a justificativa, especialmente nas pegadinhas.</p><div class="result-hero"><div><div class="eyebrow" style="color:#a2e6dc">Pontuação líquida</div><div class="result-score">${c.score>=0?'+':''}${c.score}<small> / ${c.max} pontos</small></div><p>Acerto bruto entre itens respondidos: ${c.gross}%</p></div><div style="display:flex;gap:8px;flex-wrap:wrap">${badge(`${c.right} certas`,'green')}${badge(`${c.wrong} erradas`,'red')}${badge(`${c.omitted} brancos`,'amber')}</div></div><div class="section-h"><h3>Desempenho por bloco</h3></div><div class="breakdown">${groups}</div><div class="section-h"><h3>Correção comentada</h3><div class="tabs">${[['all','Todas'],['wrong','Erros'],['blank','Brancos'],['right','Acertos']].map(([x,label])=>`<button data-review="${x}" class="${reviewFilter===x?'active':''}">${label}</button>`).join('')}</div></div>${rows.length?rows.map((r,i)=>`<div class="review-card ${r.a==='-'?'skip':r.correct?'right':'wrong'}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:start"><div>${badge(nameFor(r.q.s))} <small style="color:var(--muted)">Item ${h.itemIds.indexOf(r.q.id)+1}</small></div>${badge(r.a==='-'?'Em branco':r.correct?'Acertou':'Errou',r.a==='-'?'amber':r.correct?'green':'red')}</div><h4>${r.q.q}</h4><p style="margin:0 0 10px;font-size:12px"><strong>Sua marcação:</strong> ${r.a==='-'?'Em branco':r.a==='C'?'Certo':'Errado'} &nbsp; · &nbsp; <strong>Gabarito:</strong> ${r.q.a==='C'?'Certo':'Errado'} &nbsp; · &nbsp; <strong>Pontos:</strong> ${r.a==='-'?'0':r.correct?'+'+r.w:'−'+r.w}</p><div class="explain"><strong>Por quê?</strong> ${r.q.e}</div></div>`).join(''):`<div class="empty">Nenhum item neste filtro.</div>`}<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:23px"><button class="btn btn-primary" data-nav="setup">Novo treino →</button><button class="btn btn-outline" data-nav="history">Ver histórico</button></div>`)}
function errors(){const all=specBank().filter(q=>(db.attempts[q.id]?.wrong||0)>0).sort((a,b)=>(db.attempts[b.id]?.wrong||0)-(db.attempts[a.id]?.wrong||0));shell(`<div class="eyebrow">Repetição estratégica</div><h1 class="page-title">Caderno de erros</h1><p class="desc">Itens que você já errou em alguma sessão. Eles continuam disponíveis para revisão mesmo depois de acertá-los.</p><div style="display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px"><div>${badge(all.length+' itens com erro registrado','amber')}</div><button class="btn btn-primary" data-action="review-start" ${!all.length?'disabled':''}>Treinar meus erros →</button></div>${all.length?`<div class="panel">${all.map(q=>`<div class="history-row"><div><strong>${q.q}</strong><small>${nameFor(q.s)} · ${db.attempts[q.id].wrong} erro(s) em ${db.attempts[q.id].seen} tentativa(s)</small></div>${badge(db.attempts[q.id].lastCorrect?'Última: certo':'Última: erro',db.attempts[q.id].lastCorrect?'green':'red')}</div>`).join('')}</div>`:`<div class="empty"><div class="symbol">☆</div><strong>Seu caderno está vazio</strong>Os itens em que você errar aparecerão automaticamente aqui.</div>`}`)}
function history(){const a=completed(),tot=a.reduce((n,x)=>n+x.rows,0);shell(`<div class="eyebrow">Sua evolução ao longo do tempo</div><h1 class="page-title">Histórico e progresso</h1><p class="desc">Sessões concluídas ficam salvas neste navegador. Exporte seus dados para ter uma cópia de segurança ou migrar de dispositivo.</p><div class="stats">${stat('▤',a.length,'Sessões finalizadas')}${stat('✓',tot,'Questões resolvidas')}${stat('↗',streak(),'Dias de sequência')}${stat('◎',weakSubjects().length,'Disciplinas avaliadas')}</div><div class="panel"><div style="display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap"><h3>Minhas sessões</h3><div style="display:flex;gap:8px"><button class="btn btn-outline" data-action="export">Exportar progresso ↓</button><button class="btn btn-outline" data-action="import">Importar ↑</button><input type="file" id="file-import" accept="application/json,.json" style="display:none"></div></div>${a.length?a.map(h=>`<div class="history-row"><div><strong>${fmtDate(h.date)} · ${h.rows} itens</strong><small>${h.type==='wrong'?'Revisão de erros':'Treino'} · ${h.right} certas · ${h.wrong} erradas · ${h.omitted} brancos</small></div><div style="text-align:right"><strong style="font-size:18px;color:${h.score<0?'var(--red)':'var(--teal)'}">${h.score>=0?'+':''}${h.score}/${h.max}</strong><small>${h.gross}% bruto</small></div><button class="btn btn-soft" data-hist="${h.id}">Revisar</button></div>`).join(''):`<div class="empty"><div class="symbol">▧</div><strong>Ainda não há sessões concluídas</strong>Realize seu primeiro treino para ver os resultados aqui.</div>`}</div><div class="callout" style="margin-top:20px"><strong>Privacidade e sincronização:</strong> seus resultados são guardados localmente no navegador, não em servidor. Em outro celular ou após limpar os dados do navegador, restaure usando o arquivo de exportação.</div>`)}
function render(){if(view==='home')home();else if(view==='setup')setup();else if(view==='syllabus')syllabus();else if(view==='errors')errors();else if(view==='history')history();else if(view==='exam')exam();else if(view==='result')result()}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cgu-check-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(file){try{const content=await file.text(),x=JSON.parse(content);if(x.version!==1||!Array.isArray(x.history)||!x.attempts||!x.checkedTopics||typeof x.spec!=='string'||!SPECS.some(v=>v[0]===x.spec))throw Error('Formato incompatível');if(!confirm('Substituir os dados atuais pelos do arquivo de backup?'))return;db={...blank,...x,session:null};save();navigate('history');alert('Dados importados com sucesso.')}catch(e){alert('Não foi possível importar este arquivo: '+e.message)}}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const num=e.target.closest('[data-count]');if(num){modeCount=Number(num.dataset.count);render();return}const expand=e.target.closest('[data-expand]');if(expand){expanded[expand.dataset.expand]=!expanded[expand.dataset.expand];render();return}const answer=e.target.closest('[data-answer]');if(answer&&db.session){const qid=db.session.itemIds[db.session.current];db.session.answers[qid]=answer.dataset.answer;save();render();return}const jump=e.target.closest('[data-jump]');if(jump&&db.session){db.session.current=Number(jump.dataset.jump);save();render();return}const tab=e.target.closest('[data-review]');if(tab){reviewFilter=tab.dataset.review;render();return}const history=e.target.closest('[data-hist]');if(history){currentResults=db.history.find(h=>h.id===history.dataset.hist);reviewFilter='all';navigate('result');return}const button=e.target.closest('[data-action]');if(!button)return;switch(button.dataset.action){case 'start':start();break;case 'resume':navigate('exam');break;case 'review-start':focus='all';start('wrong');break;case 'prev':if(db.session){db.session.current=Math.max(0,db.session.current-1);save();render()}break;case 'next':if(db.session){db.session.current=Math.min(db.session.itemIds.length-1,db.session.current+1);save();render()}break;case 'finish':finish();break;case 'abandon':if(confirm('Descartar esta sessão e as marcações feitas nela?')){db.session=null;save();navigate('setup')}break;case 'export':exportData();break;case 'import':document.getElementById('file-import')?.click();break;}});
document.addEventListener('change',e=>{if(e.target.id==='specialty'){if(db.session&&!confirm('Há um treino ativo. Mudando de especialidade você descartará a sessão. Continuar?')){render();return}db.spec=e.target.value;db.session=null;focus='all';currentResults=null;save();navigate('home');return}if(e.target.id==='filter-subject'){focus=e.target.value;return}if(e.target.dataset.topic){db.checkedTopics[e.target.dataset.topic]=e.target.checked;save();let scroll=window.scrollY;render();window.scrollTo(0,scroll);return}if(e.target.id==='file-import'){const f=e.target.files?.[0];if(f)importData(f)}});
setInterval(()=>{if(db.session&&view==='exam'){const timer=document.getElementById('timer-small');if(timer)timer.textContent=timerText(db.session)}},1000);
render();
</script></body></html>
